# CodeRabbit Configuration for Om Jee Pandey Portfolio
# AI Code Review & Security Standards
language: 'en-US'
early_access: false
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'main'
      - 'master'
  path_filters:
    - '!**/*.log'
    - '!**/.agent/**'
    - '!**/.gsd/**'
    - '!**/.gemini/**'
    - '!**/.agents/**'
chat:
  auto_reply: true
